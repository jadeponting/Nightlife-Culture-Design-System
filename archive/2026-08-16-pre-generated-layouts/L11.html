<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<title>Nightlife Culture — L11 Chart slide</title>
<link rel="stylesheet" href="../tokens/fonts.css">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../system/slides.css">
<style>body{margin:0;background:#6a6a6a;padding:26px}.wrap{max-width:1100px;margin:0 auto}</style>
</head><body><div class="wrap">
<!-- L11 · Chart slide
     anchor: two · max blocks: 5 · grounds: chalk, white
     Chart ramp only. Source line mandatory. Single series = blue.
     Contract: contracts/layouts.json → layouts.L11
     Validate:  python tools/validate.py layouts/L11.html -->
<section data-layout="L11" class="nc-slide"><div class="cv ground-white">
  <div class="pad" data-anchor="two">
    <div class="k">07 · Where value is held</div>
    <div class="t sm">Share of night-time<br>economy turnover</div>
    <div class="brk" style="background:var(--nc-blue);margin:2.4cqw 0 3cqw"></div>
    <div class="chart">
      <div class="sbar"><span class="lb">Venues</span><span class="tk"><span class="fl" style="width:82%;background:var(--nc-chart-1)"></span></span><span class="vl">82</span></div>
      <div class="sbar"><span class="lb">Artists</span><span class="tk"><span class="fl" style="width:64%;background:var(--nc-chart-1)"></span></span><span class="vl">64</span></div>
      <div class="sbar"><span class="lb">Promoters</span><span class="tk"><span class="fl" style="width:47%;background:var(--nc-chart-1)"></span></span><span class="vl">47</span></div>
      <div class="sbar"><span class="lb">Crew and tech</span><span class="tk"><span class="fl" style="width:29%;background:var(--nc-chart-1)"></span></span><span class="vl">29</span></div>
    </div>
    <div class="srcline">Single series · ADM-OPEN · 2025 · LA boundary 2023 · illustrative figures</div>
  </div>
  <div class="foot"><div class="logo" style="color:var(--nc-blue)">Nightlife<br>Culture</div><div class="pnum">08</div></div>
</div></section>
</div></body></html>
